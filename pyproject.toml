[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fra-operations-forecast"
version = "0.1.0"
description = "48-hour operating-direction and Runway 18 weather forecast for Frankfurt Airport"
license = {text = "Proprietary, all rights reserved (see LICENSE)"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]

[project.scripts]
fra-forecast = "fra_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["fra_forecast*"]

[tool.setuptools.package-data]
fra_forecast = ["presentation/*.html", "presentation/*.css", "presentation/*.js"]
