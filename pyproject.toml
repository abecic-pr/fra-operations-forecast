[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fra-operations-forecast"
version = "0.1.0"
description = "Frankfurt weather ingestion and runway forecast hackathon baseline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]

[project.scripts]
fra-forecast = "fra_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["fra_forecast*"]
